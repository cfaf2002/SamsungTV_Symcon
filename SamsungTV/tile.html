    und Pegelanzeige der Lautstärke, daneben die hohe Ein/Aus-Taste · App-Tasten mit Icon oder Kürzel ·
    Tastenfeld (Navigation, rundes Steuerkreuz mit OK, Programmwippe), Stumm im Display · Medien- und Quellenleiste.

                Änderungen. Das Blinken beim Schalten ruht, solange die Kachel nicht sichtbar ist.

<style>
    /* ===== Hausstil cfaf2002 · Kachel-Grundlage v1 (siehe STYLEGUIDE.md) =====
       Farbschema 0 = Symcon-Design (Farben der Visualisierung), 1 = Dunkel, 2 = Hell.
       Modulspezifisch ist nur --brand (Akzent der festen Farbschemas). */
    :root {
        --brand: #2f6bff;
        --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        --fg: var(--content-color, #eef3f7);
        --accent: var(--accent-color, var(--brand));
        --on-accent: #ffffff;
        --muted: color-mix(in srgb, var(--fg) 65%, transparent);
        --faint: color-mix(in srgb, var(--fg) 40%, transparent);
        --line: color-mix(in srgb, var(--fg) 15%, transparent);
        --surface: color-mix(in srgb, var(--fg) 7%, transparent);
        --surface-hover: color-mix(in srgb, var(--fg) 12%, transparent);
        --popup: var(--card-color, #232a33);
        --ok: #34b36b;
        --warn: #e2a63b;
        --bad: #e5484d;
        --info: #4b8ef0;
        --off: #8796a5;
        --radius-l: 14px;
        --radius: 12px;
        --radius-s: 8px;
        --pill: 999px;
        --gap: 8px;
    }
    html.theme-dark  { --fg: #eef3f7; --accent: var(--brand); --tile-bg: #1b2530; --popup: #232d39; }
    html.theme-light { --fg: #1d2b36; --accent: var(--brand); --tile-bg: #e9eef3; --popup: #ffffff; }
    html.theme-dark body, html.theme-light body { background: var(--tile-bg); }
    html, body { font-family: var(--font); color: var(--fg); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
    /* ===== Ende Kachel-Grundlage ===== */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: transparent; }

    /* ---------- Gestaltung „Receiver-Front“: dünne Linien, eckige Tasten, Display als Blickfang ---------- */
    #tile {
        --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
        --key: var(--surface);
        --key-hover: var(--surface-hover);
        --key-press: color-mix(in srgb, var(--fg) 18%, transparent);
        --edge: var(--line);
        --edge-strong: color-mix(in srgb, var(--fg) 26%, transparent);
        --glass: color-mix(in srgb, var(--fg) 4%, transparent);
        --grid: color-mix(in srgb, var(--fg) 5%, transparent);
        --lit: var(--accent);
        --dim: color-mix(in srgb, var(--fg) 14%, transparent);
        --r-key: 6px;
        --r-box: 10px;
        /* neutraler Schatten (einzige feste Farbe, wie in den übrigen Kacheln) */
        --shadow: color-mix(in srgb, #000 22%, transparent);

        box-sizing: border-box;
        width: 100%;
        height: 100%;
        /* oben Platz für Titel und Symbole der Kachel-Visualisierung (Name kommt von Symcon) */
        padding: clamp(54px, 13cqmin, 64px) 12px 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        overflow: hidden;
        container-type: size;
        font-size: 13px;
        line-height: 1.3;
        user-select: none;
        -webkit-user-select: none;
    }

    button {
        font: inherit; color: inherit; margin: 0; padding: 0;
        background: var(--key);
        border: 1px solid var(--edge);
        border-radius: var(--r-key);
        min-height: 36px; min-width: 36px;
        display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        cursor: pointer;
        transition: background-color .12s, border-color .12s, box-shadow .12s;
        touch-action: manipulation;
    }
    button:hover { background: var(--key-hover); border-color: var(--edge-strong); }
    button:active, button.hit { background: var(--key-press); box-shadow: inset 0 1px 3px color-mix(in srgb, var(--fg) 12%, transparent); }
    button:disabled { opacity: .35; cursor: default; }
    svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

    /* Kopf: Display und daneben die hohe Ein/Aus-Taste (wie an einem Receiver) */
    .head { display: flex; gap: 8px; align-items: stretch; flex: none; }
    .head .display { flex: 1; min-width: 0; }
    .power { width: 48px; height: auto; flex: none; flex-direction: column; gap: 4px; }
    .power svg.i { width: 22px; height: 22px; }
    .power .pl { font-family: var(--mono); font-size: 9px; color: var(--muted); }

    /* LEDs oben im Display */
    .leds { display: flex; gap: 12px; flex-wrap: wrap; }
    .led { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-family: var(--mono); font-size: 10px; }
    .led i { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); transition: background-color .2s, box-shadow .2s; }
    .led.on i { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
    .led.sig i { background: var(--lit); box-shadow: 0 0 6px var(--lit); }
    .led.wait i { background: var(--warn); animation: blink 1s steps(2, start) infinite; }
    @keyframes blink { 50% { opacity: .2; } }
    #tile.on .power { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 55%, transparent); }

    /* Display */
    .display {
        flex: none;
        border: 1px solid var(--edge-strong);
        border-radius: var(--r-box);
        padding: 8px 10px 8px;
        background:
            repeating-linear-gradient(0deg, var(--grid) 0 1px, transparent 1px 4px),
            var(--glass);
        display: flex; flex-direction: column; gap: 8px;
    }
    .readout { display: flex; align-items: center; gap: 10px; min-height: 40px; }
    .art { width: 40px; height: 40px; border-radius: 6px; border: 1px solid var(--edge); overflow: hidden; display: grid; place-items: center; flex: none; background: var(--key); }
    .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .art svg.i { width: 20px; height: 20px; color: var(--muted); }
    .art .mono-ico { font-size: 15px; }
    .rd { flex: 1; min-width: 0; }
    .rd .main { font-family: var(--mono); font-size: 18px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--fg); }
    #tile:not(.on) .rd .main { color: var(--muted); }
    .rd .aux { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .tag { font-family: var(--mono); font-size: 11px; padding: 2px 6px; border: 1px solid var(--edge); border-radius: 4px; color: var(--muted); flex: none; }
    #tile.playing .tag { color: var(--lit); border-color: color-mix(in srgb, var(--lit) 50%, transparent); }

    /* Pegelanzeige Lautstärke */
    .level { display: flex; align-items: center; gap: 8px; }
    .level .k { font-family: var(--mono); font-size: 11px; color: var(--muted); width: 28px; }
    .meter { flex: 1; display: grid; grid-template-columns: repeat(20, 1fr); gap: 2px; height: 14px; cursor: pointer; }
    .meter i { border-radius: 1px; background: var(--dim); transition: background-color .15s; }
    .meter i.lit { background: var(--lit); }
    .meter i.lit.hi { background: color-mix(in srgb, var(--lit) 55%, var(--warn)); }
    #tile:not(.upnp) .meter { visibility: hidden; }
    .level .val { font-family: var(--mono); font-size: 13px; width: 30px; text-align: right; font-variant-numeric: tabular-nums; }
    #tile:not(.upnp) .level .val { color: var(--muted); }
    #tile:not(.on) .meter i.lit { background: color-mix(in srgb, var(--fg) 30%, transparent); }
    #tile:not(.on) .level .val { color: var(--muted); }
    #tile.muted .level .val, #tile.muted .meter i.lit { color: var(--bad); background: color-mix(in srgb, var(--bad) 55%, transparent); }
    .level button { width: 36px; height: 30px; min-height: 30px; }

    .notice { display: none; padding: 10px 12px; border-radius: var(--r-box); border: 1px solid color-mix(in srgb, var(--bad) 50%, transparent); background: color-mix(in srgb, var(--bad) 12%, transparent); }
    #tile.error .notice { display: block; }
    #tile.error .body { display: none; }

    /* Bedienteil */
    .body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; transition: opacity .2s; }
    #tile:not(.on) .body { opacity: .45; }

    /* App-Tasten */
    .apps { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; flex: none; padding-bottom: 2px; }
    .apps::-webkit-scrollbar { display: none; }
    .apps:empty { display: none; }
    .app { flex: none; width: 58px; flex-direction: column; gap: 4px; padding: 5px 0 4px; position: relative; }
    .app .ico { width: 36px; height: 36px; border-radius: 6px; overflow: hidden; display: grid; place-items: center; }
    .app .ico img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .app .lbl { font-size: 10px; color: var(--muted); max-width: 52px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .app::after { content: ""; position: absolute; top: 4px; right: 4px; width: 5px; height: 5px; border-radius: 50%; background: transparent; }
    .app.run { border-color: color-mix(in srgb, var(--lit) 60%, transparent); }
    .app.run::after { background: var(--lit); box-shadow: 0 0 5px var(--lit); }
    .app.run .lbl { color: var(--fg); }
    .mono-ico { width: 100%; height: 100%; display: grid; place-items: center; font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--fg);
        background: color-mix(in srgb, var(--m1) 28%, transparent); border: 1px solid color-mix(in srgb, var(--m1) 55%, transparent); border-radius: 6px; box-sizing: border-box; }

    /* Tastenfeld: Navigation | rundes Steuerkreuz | Programmwippe */
    .keys { flex: 1; min-height: 0; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-rows: minmax(0, 1fr); align-items: center; gap: 12px; }
    .nav { display: flex; flex-direction: column; gap: 10px; }
    .nav button { width: 44px; height: 44px; border-radius: 14px; border: 0; }
    .dpad {
        justify-self: center;
        align-self: center;
        position: relative;
        /* so groß, wie Höhe und Breite des Tastenfelds erlauben (höchstens 210 px) */
        height: min(100%, 210px);
        max-width: 100%;
        aspect-ratio: 1;
        box-sizing: border-box;
        border-radius: 50%;
        background:
            radial-gradient(circle at 50% 50%, transparent 31%, var(--glass) 32%),
            conic-gradient(from 225deg, color-mix(in srgb, var(--fg) 10%, transparent), transparent 25%, color-mix(in srgb, var(--fg) 10%, transparent) 50%, transparent 75%, color-mix(in srgb, var(--fg) 10%, transparent));
        border: 1px solid var(--edge);
        box-shadow: inset 0 1px 0 color-mix(in srgb, var(--fg) 8%, transparent);
    }
    .dpad button { position: absolute; background: transparent; border: 0; border-radius: 50%; }
    .dpad button:hover { background: var(--key); }
    .dpad .up    { top: 3%;    left: 34%; width: 32%; height: 28%; }
    .dpad .down  { bottom: 3%; left: 34%; width: 32%; height: 28%; }
    .dpad .left  { left: 3%;   top: 34%;  width: 28%; height: 32%; }
    .dpad .right { right: 3%;  top: 34%;  width: 28%; height: 32%; }
    .dpad .ok {
        left: 32%; top: 32%; width: 36%; height: 36%;
        background: var(--key); font-weight: 700; letter-spacing: .02em;
        box-shadow: 0 0 0 7px color-mix(in srgb, var(--fg) 4%, transparent), 0 2px 10px var(--shadow);
    }
    .dpad .ok:hover { background: var(--key-hover); }
    .rocker { display: flex; flex-direction: column; align-items: stretch; width: 44px; border-radius: var(--pill); background: var(--key); overflow: hidden; }
    .rocker button { background: transparent; border: 0; border-radius: 0; height: 44px; }
    .rocker button:hover { background: var(--key-hover); }
    .rocker .label { text-align: center; font-size: 10px; font-weight: 600; letter-spacing: .06em; color: var(--muted); padding: 2px 0; }
    #tile.muted .mute { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 50%, transparent); }

    /* Segment-Leisten: Medien und Quellen */
    .seg { display: flex; flex: none; border: 1px solid var(--edge); border-radius: var(--r-key); overflow: hidden; }
    .seg button { flex: 1; border: 0; border-radius: 0; border-right: 1px solid var(--edge); background: var(--key); height: 38px; min-width: 0; }
    .seg button:last-child { border-right: 0; }
    .seg button:hover { background: var(--key-hover); }
    .media { display: none; }
    #tile.show-media .media { display: flex; }
    .sources:empty { display: none; }
    .sources button { font-family: var(--mono); font-size: 11px; white-space: nowrap; padding: 0 6px; }
    .sources button.sel { background: color-mix(in srgb, var(--lit) 22%, transparent); color: var(--fg); box-shadow: inset 0 -2px 0 var(--lit); }

    #tile.paused * { animation-play-state: paused !important; }

    /* Größen (Höhe ohne Titelbereich): Display · + App-Tasten · + Tastenfeld · alles */
    @container (max-height: 180px) { .body { display: none; } }
    @container (max-height: 300px) { .keys { display: none !important; } }
    @container (max-height: 500px) { .media, .sources { display: none !important; } }
    @container (max-width: 340px) {
        .keys { gap: 8px; }
        .nav { gap: 8px; }
        .nav button { width: 38px; height: 38px; border-radius: 12px; }
        .rocker { width: 38px; }
        .rocker button { height: 40px; }
        .app { width: 52px; }
        #tile.upnp .level [data-vol] { display: none; }
    }
</style>

<div id="tile" role="group">
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M6.4 6.6a8 8 0 1 0 11.2 0"/></symbol>
        <symbol id="i-up" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></symbol>

    <div class="head">
    <div class="display">
        <div class="leds">
            <span class="led" id="ledPower"><i></i><span data-t="On">On</span></span>
            <span class="led" id="ledLink"><i></i><span data-t="Connected">Connected</span></span>
            <span class="led" id="ledApp"><i></i><span data-t="App">App</span></span>
        </div>
        <div class="readout">
            <div class="art" id="art"></div>

            <div class="meter" id="meter" role="slider" aria-label="Volume" aria-valuemin="0" aria-valuemax="100"></div>
            <span class="val" id="volVal">–</span>
            <button type="button" class="mute" id="mute" data-tip="Mute"><svg class="i"><use href="#i-mute"/></svg></button>
            <button type="button" data-vol="-1" data-repeat="1" data-tip="Volume −"><svg class="i"><use href="#i-minus"/></svg></button>

    </div>

    <div class="body">

        <div class="keys">

<script>
    // Hausstil: Farbschema der Kachel (0 = Symcon-Design, 1 = Dunkel, 2 = Hell)
    function applyTheme(theme) {
        var root = document.documentElement;
        root.classList.toggle('theme-dark', theme === 1);
        root.classList.toggle('theme-light', theme === 2);
    }

    (function () {
        'use strict';

        var $ = function (id) { return document.getElementById(id); };
        var tile = $('tile');
        var last = {};
        var icons = {};          // App-Icons (Data-URI), kommen nur beim Laden und bei Änderungen
        var MONO = ['var(--accent)', 'var(--info)', 'var(--ok)', 'var(--warn)', 'var(--bad)', 'var(--off)'];
        var SEGMENTS = 20;

        function t(s) {
            return typeof window.translate === 'function' ? window.translate(s) : s;
        }

        function send(ident, value) {
            if (typeof window.requestAction === 'function') {
                window.requestAction(ident, value);
            }
        }

        function el(tag, cls, text) {
            var e = document.createElement(tag);
            if (cls) e.className = cls;
            if (text !== undefined) e.textContent = text;
            return e;
        }

        function svgIcon(id) {
            var ns = 'http://www.w3.org/2000/svg';
            var svg = document.createElementNS(ns, 'svg');
            svg.setAttribute('class', 'i');
            var use = document.createElementNS(ns, 'use');
            use.setAttribute('href', id);
            svg.appendChild(use);
            return svg;
        }

        function flash(e) {
            e.classList.add('hit');
            setTimeout(function () { e.classList.remove('hit'); }, 140);
        }

        // Bild der App (Data-URI) oder Kürzel
        function appArt(app) {
            var src = icons[String(app.v)];
            if (src && /^data:image\/(png|jpeg|gif|webp|svg\+xml);base64,/.test(src)) {
                var img = el('img');
                img.alt = '';
                img.src = src;
                return img;
            }
            var words = String(app.label || '?').trim().split(/\s+/);
            var letters = words.length > 1 ? words[0].charAt(0) + words[1].charAt(0) : words[0].charAt(0) + (/\+/.test(words[0]) ? '+' : '');
            var hash = 0;
            for (var i = 0; i < app.label.length; i++) hash = (hash * 31 + app.label.charCodeAt(i)) >>> 0;
            var m = el('div', 'mono-ico', letters.toUpperCase());
            m.style.setProperty('--m1', MONO[hash % MONO.length]);
            return m;
        }

        function fire(b) {
            if (b.dataset.key) send('Key', b.dataset.key);
            else if (b.dataset.vol) send('VolumeStep', parseInt(b.dataset.vol, 10));
        }

        // Gedrückt halten wiederholt (Pfeile, Lautstärke): nach 450 ms alle 220 ms
        var holdTimer = 0, repeatTimer = 0;
        function stopRepeat() {
            clearTimeout(holdTimer);
            clearInterval(repeatTimer);
            holdTimer = repeatTimer = 0;
        }
        Array.prototype.forEach.call(document.querySelectorAll('[data-key], [data-vol]'), function (b) {
            b.addEventListener('click', function (ev) {
                if (b.dataset.repeated === '1') { b.dataset.repeated = ''; return; }
                fire(b);
                flash(b);
                ev.preventDefault();
            });
            if (b.dataset.repeat) {
                b.addEventListener('pointerdown', function () {
                    stopRepeat();
                    b.dataset.repeated = '';
                    holdTimer = setTimeout(function () {
                        b.dataset.repeated = '1';
                        fire(b);
                        repeatTimer = setInterval(function () { fire(b); flash(b); }, 220);
                    }, 450);
                });
                ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (n) {
                    b.addEventListener(n, stopRepeat);
                });
            }
        });

        $('power').addEventListener('click', function () {
            send('Power', !last.on);
            flash($('power'));
        });
        $('mute').addEventListener('click', function () {
            if (last.upnp) send('Mute', !last.mute);
            else send('Key', 'KEY_MUTE');
            flash($('mute'));
        });

        // Pegelanzeige: 20 Segmente à 5 %; Tippen setzt die Lautstärke
        var meter = $('meter');
        for (var s = 0; s < SEGMENTS; s++) meter.appendChild(el('i'));
        function paintMeter(v) {
            var lit = Math.round(v / (100 / SEGMENTS));
            Array.prototype.forEach.call(meter.children, function (seg, i) {
                seg.classList.toggle('lit', i < lit);
                seg.classList.toggle('hi', i >= SEGMENTS * 0.75);
            });
            meter.setAttribute('aria-valuenow', String(v));
            $('volVal').textContent = ('00' + v).slice(-3);
        }
        meter.addEventListener('click', function (ev) {
            if (!last.upnp || !last.on) return;
            var rect = meter.getBoundingClientRect();
            var seg = Math.min(SEGMENTS, Math.max(0, Math.ceil((ev.clientX - rect.left) / rect.width * SEGMENTS)));
            var v = seg * (100 / SEGMENTS);
            paintMeter(v);
            send('Volume', v);
        });

        var appsKey = '';
        function renderApps(list) {
            var box = $('apps');
            var key = JSON.stringify(list) + '|' + Object.keys(icons).join(',') + '|' + (last.iconsKey || '');
            if (key !== appsKey) {
                appsKey = key;
                box.textContent = '';
                (list || []).forEach(function (app) {
                    var b = el('button', 'app');
                    b.type = 'button';
                    b.dataset.v = String(app.v);
                    b.title = app.label;
                    var ico = el('div', 'ico');
                    ico.appendChild(appArt(app));
                    b.appendChild(ico);
                    b.appendChild(el('div', 'lbl', app.label));
                    b.addEventListener('click', function () { send('App', app.v); flash(b); });
                    box.appendChild(b);
                });
            }
            Array.prototype.forEach.call(box.children, function (b) {
                var run = !!last.on && parseInt(b.dataset.v, 10) === (last.running || last.app);
                b.classList.toggle('run', run);
                b.setAttribute('aria-pressed', run ? 'true' : 'false');
            });
        }

        var sourcesKey = '';
        function renderSources(list) {
            var box = $('sources');
            var key = JSON.stringify(list);
            if (key !== sourcesKey) {
                sourcesKey = key;
                box.textContent = '';
                (list || []).forEach(function (s) {
                    var b = el('button', '', s.label);
                    b.type = 'button';
                    b.dataset.v = String(s.v);
                    b.addEventListener('click', function () { send('Source', s.v); flash(b); });
                    box.appendChild(b);
                });
            }
            Array.prototype.forEach.call(box.children, function (b) {
                b.classList.toggle('sel', !!last.on && !last.running && parseInt(b.dataset.v, 10) === last.source);
            });
        }

        function findApp(v) {
            var found = null;
            (last.apps || []).forEach(function (a) { if (a.v === v) found = a; });
            return found;
        }

        function sourceLabel() {
            var found = '';
            (last.sources || []).forEach(function (s) { if (s.v === last.source) found = s.label; });
            return found;
        }

        // Display: laufende App, Quelle oder Zustand
        function renderDisplay(d) {
            var app = d.on && d.running ? findApp(d.running) : null;
            var main, aux, tag;
            if (d.pending === 'on' && !d.on) { main = t('Switching on …'); aux = d.model || ''; tag = ''; }
            else if (d.pending === 'off' && d.on) { main = t('Switching off …'); aux = d.model || ''; tag = ''; }
            else if (!d.on) { main = t('Standby'); aux = d.model || ''; tag = ''; }
            else if (app) { main = app.label; aux = t('is running'); tag = t('App'); }
            else { main = sourceLabel() || t('On'); aux = d.model || ''; tag = d.source > 0 ? 'HDMI' : 'TV'; }
            if (d.on && !d.connected && d.pairing !== 3) aux = t('Please allow “Symcon” on the TV');

            $('main').textContent = main;
            $('aux').textContent = aux;
            $('tag').textContent = tag;
            $('tag').hidden = tag === '';
            var art = $('art');
            art.textContent = '';
            art.appendChild(app ? appArt(app) : svgIcon(d.on && d.source > 0 ? '#i-hdmi' : '#i-tv'));
        }

        function led(id, state) {
            var e = $(id);
            e.classList.remove('on', 'sig', 'wait');
            if (state) e.classList.add(state);
        }

        function render(d) {
            last = d || {};
            if (d.icons && typeof d.icons === 'object') icons = d.icons;
            applyTheme(d.theme);

            var cls = [];
            if (d.on) cls.push('on');
            if (d.pending) cls.push('pending');
            if (d.error) cls.push('error');
            if (d.upnp) cls.push('upnp');
            if (d.mute) cls.push('muted');
            if (d.media) cls.push('show-media');
            if (d.on && d.running) cls.push('playing');
            if (tile.classList.contains('paused')) cls.push('paused');
            tile.className = cls.join(' ');

            led('ledPower', d.pending ? 'wait' : (d.on ? 'on' : ''));
            led('ledLink', d.connected ? 'sig' : '');
            led('ledApp', d.on && d.running ? 'sig' : '');

            renderDisplay(d);
            $('notice').textContent = d.error || '';
            $('power').setAttribute('aria-pressed', d.on ? 'true' : 'false');
            $('power').title = t(d.on ? 'Switch off' : 'Switch on');

            var active = !!d.on && !d.error;
            Array.prototype.forEach.call(document.querySelectorAll('.body button, .level button'), function (b) {
                b.disabled = !active;
            });
            if (typeof d.volume === 'number') paintMeter(d.volume);
            else $('volVal').textContent = '–';
            $('mute').setAttribute('aria-pressed', d.mute ? 'true' : 'false');

            renderApps(d.apps);
            renderSources(d.sources);
        }

        // Beschriftungen und Hinweise übersetzen
        Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (e) {
            e.textContent = t(e.getAttribute('data-t'));
        });
        Array.prototype.forEach.call(document.querySelectorAll('[data-tip]'), function (e) {
            e.title = t(e.getAttribute('data-tip'));
            e.setAttribute('aria-label', e.title);
        });

        // Blinken nur, solange die Kachel sichtbar ist
        var inView = true;
        function updatePause() {
            tile.classList.toggle('paused', document.hidden || !inView);
            if (document.hidden) stopRepeat();
        }
        document.addEventListener('visibilitychange', updatePause);
        if (window.IntersectionObserver) {
            new IntersectionObserver(function (entries) {
                inView = entries[0].isIntersecting;
                updatePause();
            }).observe(tile);
        }

        // Wird von IP-Symcon bei UpdateVisualizationValue() aufgerufen
        window.handleMessage = function (data) {
            try {
                render(typeof data === 'string' ? JSON.parse(data) : data);
            } catch (e) {
                console.error('Samsung-TV-Kachel:', e);
            }
        };

        var initial = /*INITIAL_DATA*/null;
        if (initial) {
            window.handleMessage(initial);
        }
        updatePause();
    })();
</script>
