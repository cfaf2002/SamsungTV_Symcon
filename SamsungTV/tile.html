    Aufbau: oben frei für Titel und Symbole von Symcon · Zeile mit Zustand und Ein/Aus · Steuerkreuz mit OK, Zurück und Home ·
    Lautstärke und Programm · Medientasten · Quellen und Apps als Leisten.

<style>
    /* ===== Hausstil cfaf2002 · Kachel-Grundlage v1 (siehe STYLEGUIDE.md) =====
       Farbschema 0 = Symcon-Design (Farben der Visualisierung), 1 = Dunkel, 2 = Hell.
       Modulspezifisch ist nur --brand (Akzent der festen Farbschemas). */
    :root {
        --brand: #2f6bff;
        --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        --fg: var(--content-color, #eef3f7);
        --accent: var(--accent-color, var(--brand));
        --on-accent: #ffffff;
        --muted: color-mix(in srgb, var(--fg) 65%, transparent);
        --faint: color-mix(in srgb, var(--fg) 40%, transparent);
        --line: color-mix(in srgb, var(--fg) 15%, transparent);
        --surface: color-mix(in srgb, var(--fg) 7%, transparent);
        --surface-hover: color-mix(in srgb, var(--fg) 12%, transparent);
        --popup: var(--card-color, #232a33);
        --ok: #34b36b;
        --warn: #e2a63b;
        --bad: #e5484d;
        --info: #4b8ef0;
        --off: #8796a5;
        --radius-l: 14px;
        --radius: 12px;
        --radius-s: 8px;
        --pill: 999px;
        --gap: 8px;
    }
    html.theme-dark  { --fg: #eef3f7; --accent: var(--brand); --tile-bg: #1b2530; --popup: #232d39; }
    html.theme-light { --fg: #1d2b36; --accent: var(--brand); --tile-bg: #e9eef3; --popup: #ffffff; }
    html.theme-dark body, html.theme-light body { background: var(--tile-bg); }
    html, body { font-family: var(--font); color: var(--fg); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
    /* ===== Ende Kachel-Grundlage ===== */

    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: transparent; }

    #tile {
        --tv-key: var(--surface);
        --tv-key-hover: var(--surface-hover);
        --tv-pad: color-mix(in srgb, var(--fg) 5%, transparent);
        --tv-state: var(--off);

        box-sizing: border-box;
        width: 100%;
        height: 100%;
        /* oben Platz für Titel und Symbole der Kachel-Visualisierung (Name kommt von Symcon) */
        padding: clamp(40px, 11cqmin, 54px) 12px 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        overflow: hidden;
        container-type: size;
        font-size: 13px;
        line-height: 1.3;
        user-select: none;
        -webkit-user-select: none;
    }
    #tile.on { --tv-state: var(--ok); }
    #tile.error { --tv-state: var(--bad); }

    /* Kopfzeile */
    .head { display: flex; align-items: center; gap: 10px; min-height: 44px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--tv-state); flex: none;
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--tv-state) 22%, transparent); }
    .title { flex: 1; min-width: 0; }
    .name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .state { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    button {
        font: inherit;
        color: inherit;
        border: 0;
        margin: 0;
        padding: 0;
        background: var(--tv-key);
        border-radius: var(--radius);
        min-height: 36px;
        min-width: 36px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        cursor: pointer;
        transition: background-color .15s, transform .08s, opacity .2s;
        touch-action: manipulation;
    }
    button:hover { background: var(--tv-key-hover); }
    button:active, button.hit { transform: scale(.94); background: color-mix(in srgb, var(--accent) 28%, transparent); }
    button:disabled { opacity: .35; cursor: default; transform: none; }
    svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

    .power { width: 44px; height: 44px; border-radius: 50%; flex: none; }
    #tile.on .power { background: var(--accent); color: var(--on-accent); }
    #tile.pending .power { animation: pulse 1.1s ease-in-out infinite; }
    #tile.paused * { animation-play-state: paused !important; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--accent) 30%, transparent); } }

    .notice { display: none; padding: 8px 10px; border-radius: var(--radius-s); background: color-mix(in srgb, var(--bad) 18%, transparent); }
    #tile.error .notice { display: block; }
    #tile.error .body { display: none; }

    /* Bedienteil */
    .body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; transition: opacity .2s; }
    #tile:not(.on) .body { opacity: .45; }
    .main { display: flex; gap: 12px; align-items: center; justify-content: center; flex: 1; min-height: 0; }

    .dpad {
        position: relative;
        width: min(200px, 46cqw, 52cqh);
        aspect-ratio: 1;
        border-radius: 50%;
        background: var(--tv-pad);
        border: 1px solid var(--line);
        flex: none;
    }
    .dpad button { position: absolute; background: transparent; border-radius: 50%; }
    .dpad button:hover { background: var(--surface); }
    .dpad .up    { top: 4%;  left: 34%; width: 32%; height: 28%; }
    .dpad .down  { bottom: 4%; left: 34%; width: 32%; height: 28%; }
    .dpad .left  { left: 4%; top: 34%; width: 28%; height: 32%; }
    .dpad .right { right: 4%; top: 34%; width: 28%; height: 32%; }
    .dpad .ok    { left: 33%; top: 33%; width: 34%; height: 34%; background: var(--tv-key); font-weight: 600; }
    .dpad .ok:hover { background: var(--tv-key-hover); }

    .side { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .row { display: flex; gap: 8px; align-items: center; }
    .row > button { flex: 1; }
    .nav button { min-width: 48px; padding: 0 10px; }

    .rocker { display: flex; flex-direction: column; align-items: stretch; background: var(--tv-key); border-radius: var(--pill); width: 48px; overflow: hidden; }
    .rocker button { background: transparent; border-radius: 0; height: 40px; }
    .rocker button:hover { background: var(--surface); }
    .rocker .label { text-align: center; font-size: 11px; color: var(--muted); padding: 2px 0; font-variant-numeric: tabular-nums; }
    .rockers { display: flex; gap: 8px; align-items: center; }

    /* Lautstärke mit UPnP */
    .volume { display: none; align-items: center; gap: 8px; }
    #tile.upnp .volume { display: flex; }
    .volume input { flex: 1; min-width: 0; accent-color: var(--accent); height: 36px; margin: 0; }
    .volume .val { width: 32px; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
    #tile.muted .mute { color: var(--bad); }

    .media { display: none; gap: 8px; }
    #tile.show-media .media { display: flex; }
    .media button { flex: 1; }

    .strip { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: none; }
    .strip::-webkit-scrollbar { display: none; }
    .strip:empty { display: none; }
    .strip button { padding: 0 12px; border-radius: var(--pill); white-space: nowrap; flex: none; font-size: 12px; }
    .strip button.sel { background: var(--accent); color: var(--on-accent); }

    /* Kleine Kachel: nur Kopfzeile und Lautstärke */
    .mini { display: none; gap: 8px; }
    @container (max-height: 270px) {
        .main, .media, .strip { display: none !important; }
        .mini { display: flex; }
        .mini button { flex: 1; }
    }
    @container (max-height: 160px) {
        .body { display: none; }
    }
    @container (max-width: 300px) {
        .main { flex-direction: column; }
        .dpad { width: min(170px, 80cqw, 34cqh); }
    }
</style>

    <div class="notice" id="notice"></div>

    <div class="body">

                <button type="button" class="up"    data-key="KEY_UP"    data-repeat="1" data-tip="Up"><svg class="i"><use href="#i-up"/></svg></button>

        </div>

        <div class="volume">
            <input type="range" id="volume" min="0" max="100" step="1" aria-label="Volume">
            <span class="val" id="volVal"></span>

</div>

<script>
    // Hausstil: Farbschema der Kachel (0 = Symcon-Design, 1 = Dunkel, 2 = Hell)
    function applyTheme(theme) {
        var root = document.documentElement;
        root.classList.toggle('theme-dark', theme === 1);
        root.classList.toggle('theme-light', theme === 2);
    }

    (function () {
        'use strict';

        var $ = function (id) { return document.getElementById(id); };
        var tile = $('tile');
        var last = {};
        var dragging = false;

        function t(s) {
            return typeof window.translate === 'function' ? window.translate(s) : s;
        }

        function send(ident, value) {
            if (typeof window.requestAction === 'function') {
                window.requestAction(ident, value);
            }
        }

        function flash(el) {
            el.classList.add('hit');
            setTimeout(function () { el.classList.remove('hit'); }, 140);
        }

        // Taste bzw. Lautstärkeschritt einer Schaltfläche ausführen
        function fire(el) {
            if (el.dataset.key) send('Key', el.dataset.key);
            else if (el.dataset.vol) send('VolumeStep', parseInt(el.dataset.vol, 10));
        }

        // Gedrückt halten wiederholt (Pfeile, Lautstärke): nach 450 ms alle 220 ms
        var holdTimer = 0, repeatTimer = 0;
        function stopRepeat() {
            clearTimeout(holdTimer);
            clearInterval(repeatTimer);
            holdTimer = repeatTimer = 0;
        }
        Array.prototype.forEach.call(document.querySelectorAll('[data-key], [data-vol]'), function (el) {
            el.addEventListener('click', function (ev) {
                if (el.dataset.repeated === '1') { el.dataset.repeated = ''; return; }
                fire(el);
                flash(el);
                ev.preventDefault();
            });
            if (el.dataset.repeat) {
                el.addEventListener('pointerdown', function () {
                    stopRepeat();
                    el.dataset.repeated = '';
                    holdTimer = setTimeout(function () {
                        el.dataset.repeated = '1';
                        fire(el);
                        repeatTimer = setInterval(function () { fire(el); flash(el); }, 220);
                    }, 450);
                });
                ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (n) {
                    el.addEventListener(n, stopRepeat);
                });
            }
        });

        $('power').addEventListener('click', function () {
            send('Power', !last.on);
            flash($('power'));
        });

        ['mute', 'mute3'].forEach(function (id) {
            $(id).addEventListener('click', function () {
                if (last.upnp) send('Mute', !last.mute);
                else send('Key', 'KEY_MUTE');
                flash($(id));
            });
        });

        var vol = $('volume');
        vol.addEventListener('input', function () {
            dragging = true;
            $('volVal').textContent = vol.value;
        });
        vol.addEventListener('change', function () {
            dragging = false;
            send('Volume', parseInt(vol.value, 10));
        });

        // Leiste mit Schaltflächen (Quellen, Apps) nur bei Änderung neu bauen
        function strip(box, list, selected, ident) {
            var key = JSON.stringify(list);
            if (box.dataset.key !== key) {
                box.dataset.key = key;
                box.textContent = '';
                (list || []).forEach(function (item) {
                    var b = document.createElement('button');
                    b.type = 'button';
                    b.textContent = item.label;
                    b.dataset.v = String(item.v);
                    b.addEventListener('click', function () {
                        send(ident, item.v);
                        flash(b);
                    });
                    box.appendChild(b);
                });
            }
            Array.prototype.forEach.call(box.children, function (b) {
                b.classList.toggle('sel', !!last.on && parseInt(b.dataset.v, 10) === selected);
            });
        }

        function stateText(d) {
            if (d.pending === 'on' && !d.on) return t('Switching on …');
            if (d.pending === 'off' && d.on) return t('Switching off …');
            if (!d.on) return t('Off');
            if (d.pairing === 1 || (!d.connected && d.pairing !== 3)) return t('Please allow “Symcon” on the TV');
            if (!d.connected) return t('Connecting …');
            return d.model ? t('On') + ' · ' + d.model : t('On');
        }

        function render(d) {
            last = d || {};
            applyTheme(d.theme);

            var cls = [];
            if (d.on) cls.push('on');
            if (d.pending) cls.push('pending');
            if (d.error) cls.push('error');
            if (d.upnp) cls.push('upnp');
            if (d.mute) cls.push('muted');
            if (d.media) cls.push('show-media');
            if (tile.classList.contains('paused')) cls.push('paused');
            tile.className = cls.join(' ');

            $('state').textContent = stateText(d);
            $('notice').textContent = d.error || '';
            $('power').setAttribute('aria-pressed', d.on ? 'true' : 'false');
            $('power').title = t(d.on ? 'Switch off' : 'Switch on');

            var active = !!d.on && !d.error;
            Array.prototype.forEach.call(document.querySelectorAll('.body button, .body input'), function (el) {
                el.disabled = !active;
            });

            if (typeof d.volume === 'number') {
                if (!dragging) vol.value = String(d.volume);
                $('volVal').textContent = dragging ? vol.value : String(d.volume);
                $('volLabel').textContent = String(d.volume);
            } else {
                $('volLabel').textContent = t('VOL');
            }
            ['mute', 'mute3'].forEach(function (id) {
                $(id).setAttribute('aria-pressed', d.mute ? 'true' : 'false');
            });

            strip($('sources'), d.sources, d.source, 'Source');
            strip($('apps'), d.apps, d.app, 'App');
        }

        // Beschriftungen und Hinweise übersetzen
        Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (el) {
            el.textContent = t(el.getAttribute('data-t'));
        });
        Array.prototype.forEach.call(document.querySelectorAll('[data-tip]'), function (el) {
            el.title = t(el.getAttribute('data-tip'));
            el.setAttribute('aria-label', el.title);
        });

        // Animation nur, solange die Kachel sichtbar ist
        var inView = true;
        function updatePause() {
            tile.classList.toggle('paused', document.hidden || !inView);
            if (document.hidden) stopRepeat();
        }
        document.addEventListener('visibilitychange', updatePause);
        if (window.IntersectionObserver) {
            new IntersectionObserver(function (entries) {
                inView = entries[0].isIntersecting;
                updatePause();
            }).observe(tile);
        }

        // Wird von IP-Symcon bei UpdateVisualizationValue() aufgerufen
        window.handleMessage = function (data) {
            try {
                render(typeof data === 'string' ? JSON.parse(data) : data);
            } catch (e) {
                console.error('Samsung-TV-Kachel:', e);
            }
        };

        var initial = /*INITIAL_DATA*/null;
        if (initial) {
            window.handleMessage(initial);
        }
        updatePause();
    })();
</script>
